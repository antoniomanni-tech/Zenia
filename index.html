<style>
  :root{
    --navy:#0B2545; --navy2:#16213A; --teal:#14B8A6; --teal-dark:#0E7C86;
    --bg:#F4F6F8; --card:#FFFFFF; --border:#E4E8EC; --text:#16213A; --text2:#5B6472;
    --green:#1E9E5A; --amber:#C88A1A; --red:#D14343;
    --green-bg:#E7F7EE; --amber-bg:#FBF0DC; --red-bg:#FBE9E9; --blue:#2563EB; --blue-bg:#E8EFFD;
  }
  body{transition:background-color .2s, color .2s}
  .card, .kpi, table, .modal-box, .public-card{transition:background-color .2s, border-color .2s}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:'Source Sans 3',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
  h1,h2,h3,.brand{font-family:'Manrope',sans-serif}
  .app{display:flex;min-height:100vh}
  .sidebar{width:240px;background:var(--card);color:var(--text);padding:26px 16px;flex-shrink:0;border-right:1px solid var(--border);position:relative}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;margin-bottom:8px;padding:0 8px}
  .brand .logo{width:30px;height:30px;background:linear-gradient(135deg,var(--teal),var(--teal-dark));border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(20,184,166,0.35)}
  .brand .logo svg{width:16px;height:16px}
  .sidebar-sub{font-size:11px;color:var(--text2);padding:0 8px;margin-bottom:24px;letter-spacing:.03em}
  .nav-item{padding:10px 12px;border-radius:8px;font-size:14px;color:var(--text2);cursor:pointer;margin-bottom:2px;display:flex;gap:10px;align-items:center;transition:background .15s,color .15s}
  .nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.85}
  .nav-item:hover{background:rgba(11,37,69,0.05);color:var(--text)}
  .nav-item.active{background:rgba(20,184,166,0.12);color:var(--navy);font-weight:600}
  .main{flex:1;padding:36px 44px;max-width:1240px}
  h1.page-title{font-size:25px;margin:0;letter-spacing:-.01em}
  .subtitle{color:var(--text2);font-size:14px;margin-top:5px;display:flex;align-items:center;gap:6px}
  .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 0 3px rgba(30,158,90,0.15)}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0 28px}
  .kpis-5{grid-template-columns:repeat(5,1fr)}
  .grid-2col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 1px 2px rgba(16,24,40,0.04);transition:box-shadow .15s,transform .15s}
  .kpi:hover{box-shadow:0 6px 16px rgba(16,24,40,0.08);transform:translateY(-1px)}
  .kpi .label{font-size:11px;letter-spacing:.05em;color:var(--text2);text-transform:uppercase;margin-bottom:8px;font-weight:600}
  .kpi .value{font-size:28px;font-weight:800;letter-spacing:-.01em}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(16,24,40,0.04)}
  th{text-align:left;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:14px 18px;border-bottom:1px solid var(--border);background:rgba(127,127,127,0.08)}
  td{padding:16px 18px;border-bottom:1px solid var(--border);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr.row{cursor:pointer;transition:background .12s}
  tr.row:hover{background:rgba(127,127,127,0.06)}
  .proj-name{font-weight:700;font-size:14.5px}
  .proj-client{font-size:12.5px;color:var(--text2)}
  .pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
  .g{background:var(--green)} .a{background:var(--amber)} .r{background:var(--red)}
  .g-bg{background:var(--green-bg);color:var(--green)} .a-bg{background:var(--amber-bg);color:var(--amber)} .r-bg{background:var(--red-bg);color:var(--red)} .b{background:var(--blue)} .b-bg{background:var(--blue-bg);color:var(--blue)}
  .bar-track{width:100px;height:6px;background:#EDEFF2;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
  .bar-fill{height:100%;border-radius:4px}
  .btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:600;font-size:14px;cursor:pointer}
  .btn:hover{background:var(--navy2)}
  .link-input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;color:var(--text2);background:rgba(127,127,127,0.08)}
  .back{color:var(--teal-dark);font-size:13.5px;cursor:pointer;margin-bottom:14px;display:inline-block}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
  .hito{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
  .hito:last-child{border-bottom:none}
  .riesgo{padding:12px;border-radius:8px;margin-bottom:8px;font-size:13.5px}
  .public-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
  .public-card{max-width:520px;width:100%;background:var(--card);border-radius:16px;padding:32px;box-shadow:0 10px 40px rgba(16,24,40,0.08)}
  .footer-note{text-align:center;font-size:12px;color:var(--text2);margin-top:18px}
  .loading{padding:60px;text-align:center;color:var(--text2)}
  .filtro-pills{display:flex;gap:8px;margin-bottom:16px}
  .filtro-pill{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s}
  .filtro-pill:hover{background:rgba(127,127,127,0.06)}
  .filtro-pill.active{background:var(--navy);color:#fff;border-color:var(--navy)}

  @media (max-width: 760px) {
    .app{flex-direction:column}
    .sidebar{width:100%;padding:16px 18px;position:relative;box-shadow:none}
    .sidebar > div[style*="position:absolute"]{position:static !important;margin-top:14px}
    .sidebar-sub{margin-bottom:12px}
    .nav-item{display:inline-flex;margin-right:6px}
    .main{padding:16px 14px}
    .page-title{font-size:21px}
    .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
    .kpis-5{grid-template-columns:repeat(2,1fr)}
    .grid-2col{grid-template-columns:1fr}
    .kpi{padding:14px}
    .kpi .value{font-size:22px}
    table{display:block;overflow-x:auto;white-space:nowrap}
    .public-card{padding:22px;max-width:100%}
    .public-wrap{padding:14px}
    .modal-box{padding:20px;width:calc(100% - 32px)}
    .modal-overlay{padding:16px}
    .filtro-pills{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}
    .filtro-pill{flex-shrink:0}
    /* Encabezados con botón: apilar en vertical */
    .main > div[style*="justify-content:space-between"]{flex-direction:column;align-items:stretch !important;gap:12px}
    .main > div[style*="justify-content:space-between"] > button{width:100%}
    /* Formularios en 2 columnas: apilar */
    div[style*="display:flex;gap:14px"]{flex-direction:column;gap:0 !important}
    div[style*="display:flex;gap:18px"]{flex-direction:column}
    .link-input{font-size:11px}
  }
  .modal-overlay{position:fixed;inset:0;background:rgba(11,37,69,0.45);display:flex;align-items:center;justify-content:center;z-index:100}
  .modal-box{background:var(--card);border-radius:14px;padding:28px;width:420px;max-width:90vw;box-shadow:0 20px 60px rgba(16,24,40,0.25)}
  .form-label{display:block;font-size:12.5px;font-weight:600;color:var(--text2);margin:14px 0 6px}
  .form-input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;color:var(--text)}
  .form-input:focus{outline:2px solid var(--teal);outline-offset:1px}
</style>

async function sb(path) {
  const token = (session && session.access_token) || SUPABASE_KEY;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${token}` }
  });
  if (res.status === 401 && session) {
    sesionExpirada();
    throw new Error('Sesión expirada');
  }
  if (!res.ok) throw new Error('Error consultando Supabase: ' + res.status);
  return res.json();
}

function sesionExpirada() {
  session = null;
  localStorage.removeItem('zenia_session');
  renderLogin();
  setTimeout(() => {
    const err = document.getElementById('login-error');
    if (err) { err.textContent = 'Tu sesión expiró. Inicia sesión de nuevo.'; err.style.display = 'block'; }
  }, 50);
}

const ESTADO_LABEL = { en_curso: 'En curso', en_riesgo: 'En riesgo', atrasado: 'Atrasado', completado: 'Completado' };
const ESTADO_CLASS = { en_curso: 'g', en_riesgo: 'a', atrasado: 'r', completado: 'b' };
const ESTADO_BG = { en_curso: 'g-bg', en_riesgo: 'a-bg', atrasado: 'r-bg', completado: 'b-bg' };
const SEV_LABEL = { alta: 'Alta', media: 'Media', baja: 'Baja' };

function fechaCorta(d){ if(!d) return '—'; const f = new Date(d+'T00:00:00'); return f.toLocaleDateString('es-CL', {day:'2-digit', month:'short', year:'numeric'}); }
function iniciales(nombre){ return nombre.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase(); }

const root = document.getElementById('root');
const params = new URLSearchParams(window.location.search);
const codigoPublico = params.get('p');
let currentView = 'panel';
let session = null;
try { const saved = localStorage.getItem('zenia_session'); if (saved) session = JSON.parse(saved); } catch(e) {}

if (codigoPublico) {
  renderVistaPublica(codigoPublico);
} else if (session) {
  route();
} else {
  renderLogin();
}

function route() {
  if (currentView === 'panel') renderApp();
  else if (currentView === 'reportes') renderReportes();
  else if (currentView === 'configuracion') renderConfiguracion();
  else if (currentView === 'detalle') renderDetalleProyecto(proyectoDetalleId);
  else if (currentView === 'cuenta') renderCuenta();
}

function irA(vista) { currentView = vista; route(); }
function verDetalleProyecto(id) { proyectoDetalleId = id; currentView = 'detalle'; route(); }
let perfilesCache = [];
let empresaCache = null;
let proyectoDetalleId = null;
let proyectosPanelCache = [];
let perfilPorIdPanelCache = {};
let filtroPanelActual = 'todos';

function tablaProyectosHTML() {
  const filtrados = filtroPanelActual === 'todos' ? proyectosPanelCache : proyectosPanelCache.filter(p => p.estado === filtroPanelActual);
  if (proyectosPanelCache.length === 0) {
    return `
    <div class="card" style="text-align:center;padding:50px 30px">
      <div style="width:52px;height:52px;border-radius:14px;background:rgba(20,184,166,0.14);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="var(--teal-dark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      </div>
      <h3 style="margin:0 0 6px">Aún no tienes proyectos</h3>
      <div style="color:var(--text2);font-size:14px;margin-bottom:20px">Crea tu primer proyecto para empezar a ver el estado de tu portafolio.</div>
      <button class="btn" onclick="abrirModalNuevoProyecto()">+ Crear mi primer proyecto</button>
    </div>`;
  }
  return `
  <table>
    <thead><tr><th>Proyecto</th><th>Estado</th><th>Avance</th><th>Responsable</th><th>Fecha límite</th><th>Link público</th></tr></thead>
    <tbody>
      ${filtrados.map(p => `
        <tr class="row" onclick="verDetalleProyecto('${p.id}')">
          <td><div class="proj-name">${p.nombre}</div><div class="proj-client">${p.cliente || ''}</div></td>
          <td><span class="pill ${ESTADO_BG[p.estado]}"><span class="dot ${ESTADO_CLASS[p.estado]}"></span>${ESTADO_LABEL[p.estado]}</span></td>
          <td><span class="bar-track"><div class="bar-fill ${ESTADO_CLASS[p.estado]}" style="width:${p.avance_pct}%"></div></span>${p.avance_pct}%</td>
          <td>${perfilPorIdPanelCache[p.responsable_id] || '—'}</td>
          <td>${fechaCorta(p.fecha_limite)}</td>
          <td onclick="event.stopPropagation()">
            <div style="display:flex;gap:6px;align-items:center">
              <input class="link-input" readonly value="${window.location.origin}${window.location.pathname}?p=${p.codigo_publico}" onclick="this.select()">
              <button class="btn" style="padding:8px 10px;background:var(--card);color:var(--text);border:1px solid var(--border)" onclick="window.open('?p=${p.codigo_publico}','_blank')" title="Abrir link público">↗</button>
            </div>
          </td>
        </tr>`).join('') || `<tr><td colspan="6" style="text-align:center;color:var(--text2);padding:30px">Ningún proyecto con este estado.</td></tr>`}
    </tbody>
  </table>
  <div class="footer-note" style="text-align:left;margin-top:14px">Haz clic en un proyecto para ver el detalle y actualizarlo. El ícono ↗ abre la vista pública (sin login).</div>`;
}

function filtrarPanel(estado) {
  filtroPanelActual = estado;
  document.getElementById('tabla-proyectos-container').innerHTML = tablaProyectosHTML();
  document.querySelectorAll('.filtro-pill').forEach(el => el.classList.toggle('active', el.dataset.filtro === estado));
}

function sidebarHTML(activo, nombreEmpresa) {
  const item = (id, label, icon) => `<div class="nav-item ${activo===id?'active':''}" onclick="irA('${id}')">${icon}${label}</div>`;
  return `
  <div class="sidebar">

async function renderReportes() {
  root.innerHTML = '<div class="loading">Cargando reportes…</div>';
  try {
    const [proyectos, perfiles, riesgos, empresas] = await Promise.all([
      sb(`proyectos?select=*`),
      sb(`perfiles?select=id,nombre`),
      sb(`riesgos?select=*&abierto=eq.true`),
      sb(`empresas?select=*`)
    ]);
    const empresa = empresas[0] || {};
    const perfilPorId = Object.fromEntries(perfiles.map(p => [p.id, p.nombre]));
    const total = proyectos.length;
    const enCurso = proyectos.filter(p => p.estado === 'en_curso').length;
    const enRiesgo = proyectos.filter(p => p.estado === 'en_riesgo').length;
    const atrasados = proyectos.filter(p => p.estado === 'atrasado').length;
    const riesgosAltos = riesgos.filter(r => r.severidad === 'alta').length;
    const avancePromedio = total ? Math.round(proyectos.reduce((s,p)=>s+p.avance_pct,0)/total) : 0;
    const cumplimiento = total ? Math.round(((enCurso)/total)*100) : 0;

    // Días de atraso acumulados: hoy - fecha_limite para proyectos atrasados
    const hoy = new Date();
    const diasAtraso = proyectos.filter(p=>p.estado==='atrasado' && p.fecha_limite).reduce((sum,p)=>{
      const lim = new Date(p.fecha_limite+'T00:00:00');
      const dias = Math.max(0, Math.round((hoy - lim)/(1000*60*60*24)));
      return sum + dias;
    },0);

    // Avance promedio por responsable
    const porResponsable = {};
    proyectos.forEach(p => {
      const nombre = perfilPorId[p.responsable_id] || 'Sin asignar';
      if(!porResponsable[nombre]) porResponsable[nombre] = [];
      porResponsable[nombre].push(p.avance_pct);
    });
    const responsablesArr = Object.entries(porResponsable).map(([nombre, arr]) => ({
      nombre, avg: Math.round(arr.reduce((a,b)=>a+b,0)/arr.length)
    })).sort((a,b)=>b.avg-a.avg);

    const atencion = proyectos.filter(p => p.estado==='en_riesgo' || p.estado==='atrasado');
    const enCursoLista = proyectos.filter(p => p.estado==='en_curso' || p.estado==='completado');

    const proyectoPorId = Object.fromEntries(proyectos.map(p => [p.id, p]));
    let resumenTexto;
    if (atencion.length === 0) {
      resumenTexto = `Los ${total} proyectos del portafolio avanzan según lo planificado, con un cumplimiento de plazos del ${cumplimiento}% y sin riesgos abiertos de severidad alta.`;
    } else {
      const atrasadosArr = atencion.filter(p=>p.estado==='atrasado').sort((a,b)=>a.avance_pct-b.avance_pct);
      const peor = atrasadosArr[0] || atencion[0];
      const riesgoDelPeor = riesgos.find(r => r.proyecto_id === peor.id);
      resumenTexto = `${atencion.length} de ${total} proyecto${atencion.length>1?'s':''} requiere${atencion.length>1?'n':''} atención esta semana. El caso más crítico es "${peor.nombre}"${peor.cliente ? ' (' + peor.cliente + ')' : ''}, con ${peor.avance_pct}% de avance` +
        (riesgoDelPeor ? `; principal riesgo: ${riesgoDelPeor.descripcion}` : '.') +
        ` El resto del portafolio mantiene un cumplimiento de plazos del ${cumplimiento}%.`;
    }

    root.innerHTML = `
    <div class="app">
      ${sidebarHTML('reportes', empresa.nombre)}
      <div class="main">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <h1 class="page-title">Reporte Ejecutivo de Portafolio</h1>
            <div class="subtitle"><span class="live-dot"></span>Generado automáticamente · ${fechaCorta(new Date().toISOString().slice(0,10))} · ${empresa.nombre || ''}</div>
          </div>
          <button class="btn" onclick="window.print()">Descargar PDF</button>
        </div>

        <div class="card" style="background:linear-gradient(135deg,#0B2545,#16213A);color:#fff;border:none;display:flex;gap:14px;align-items:flex-start">
          <div style="width:34px;height:34px;border-radius:9px;background:rgba(20,184,166,0.2);display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg>
          </div>
          <div>
            <div style="font-size:11px;letter-spacing:.05em;color:#5EEAD4;text-transform:uppercase;font-weight:700;margin-bottom:4px">Resumen ejecutivo</div>
            <div style="font-size:14.5px;line-height:1.5;color:#E4E8EC">${resumenTexto}</div>
          </div>
        </div>

        <div class="kpis">
          <div class="kpi"><div class="label">Total proyectos</div><div class="value">${total}</div></div>
          <div class="kpi"><div class="label"><span class="dot g" style="margin-right:6px"></span>En curso</div><div class="value">${enCurso}</div></div>
          <div class="kpi"><div class="label"><span class="dot a" style="margin-right:6px"></span>En riesgo</div><div class="value">${enRiesgo}</div></div>
          <div class="kpi"><div class="label"><span class="dot r" style="margin-right:6px"></span>Atrasados</div><div class="value">${atrasados}</div></div>
        </div>

        <h3 style="margin:0 0 12px">Indicadores clave</h3>
        <div class="kpis kpis-5">
          <div class="kpi"><div class="label">Riesgos abiertos</div><div class="value">${riesgos.length}</div></div>
          <div class="kpi"><div class="label">Riesgos severidad alta</div><div class="value" style="color:var(--red)">${riesgosAltos}</div></div>
          <div class="kpi"><div class="label">Cumplimiento de plazos</div><div class="value">${cumplimiento}%</div></div>
          <div class="kpi"><div class="label">Días de atraso acumulados</div><div class="value">${diasAtraso}</div></div>
          <div class="kpi"><div class="label">Avance promedio</div><div class="value">${avancePromedio}%</div></div>
        </div>

        <div class="grid-2col">
          <div class="card">
            <h3 style="margin:0 0 14px">Distribución de estado</h3>
            ${donutChartHTML([
              { label: 'En curso', value: enCurso, color: 'var(--green)' },
              { label: 'En riesgo', value: enRiesgo, color: 'var(--amber)' },
              { label: 'Atrasados', value: atrasados, color: 'var(--red)' },
              { label: 'Completados', value: proyectos.filter(p=>p.estado==='completado').length, color: 'var(--blue)' }
            ], total)}
          </div>

          <div class="card">
            <h3 style="margin:0 0 14px">Avance promedio por responsable</h3>
            ${responsablesArr.map(r => `
              <div style="margin-bottom:12px">
                <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px"><span>${r.nombre}</span><strong>${r.avg}%</strong></div>
                <div class="bar-track" style="width:100%"><div class="bar-fill g" style="width:${r.avg}%"></div></div>
              </div>`).join('')}
          </div>
        </div>

        <div class="card">
          <h3 style="margin:0 0 14px">Proyectos que requieren atención</h3>
          ${atencion.map(p => `
            <div class="riesgo ${ESTADO_BG[p.estado]}" style="display:flex;justify-content:space-between;align-items:center">
              <div><span class="pill ${ESTADO_BG[p.estado]}" style="margin-right:8px">${ESTADO_LABEL[p.estado]}</span><strong>${p.nombre}</strong> · ${p.cliente || ''}</div>
              <strong>${p.avance_pct}%</strong>
            </div>`).join('') || '<div style="color:var(--text2);font-size:13.5px">Ningún proyecto requiere atención especial.</div>'}
        </div>

        <div class="card">
          <h3 style="margin:0 0 14px">Resto de proyectos en curso</h3>
          ${enCursoLista.map(p => `
            <div class="hito"><span>${p.nombre}</span><span>${perfilPorId[p.responsable_id] || '—'} · <strong style="color:var(--green)">${p.avance_pct}%</strong></span></div>`).join('') || '<div style="color:var(--text2);font-size:13.5px">Sin proyectos adicionales.</div>'}
        </div>
      </div>
    </div>`;
  } catch (e) {
    if (!session) { return; }
    root.innerHTML = `<div class="loading">Error cargando el reporte: ${e.message}</div>`;
  }
}

async function sbWrite(path, method, body) {
  const token = (session && session.access_token) || SUPABASE_KEY;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method,
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
    body: JSON.stringify(body)
  });
  if (res.status === 401 && session) { sesionExpirada(); throw new Error('Sesión expirada'); }
  if (!res.ok) throw new Error('Error guardando (' + res.status + ')');
}

async function guardarActualizacion(proyectoId) {
  const avance_pct = parseInt(document.getElementById('det-avance').value, 10);
  const estado = document.getElementById('det-estado').value;
  const msg = document.getElementById('det-msg');
  const btn = document.getElementById('det-guardar');
  btn.textContent = 'Guardando…'; btn.disabled = true;
  try {
    await sbWrite(`proyectos?id=eq.${proyectoId}`, 'PATCH', { avance_pct, estado });
    await sbWrite('actualizaciones_semanales', 'POST', { proyecto_id: proyectoId, avance_pct, estado });
    msg.style.display = 'block'; msg.style.color = 'var(--green)'; msg.textContent = 'Actualización guardada.';
    setTimeout(() => renderDetalleProyecto(proyectoId), 600);
  } catch (e) {
    msg.style.display = 'block'; msg.style.color = 'var(--red)'; msg.textContent = e.message;
    btn.textContent = 'Guardar actualización'; btn.disabled = false;
  }
}

async function actualizarEstadoHito(hitoId, estado, proyectoId) {
  try {
    const body = { estado };

    await sbWrite(`hitos?id=eq.${hitoId}`, 'PATCH', body);
    renderDetalleProyecto(proyectoId);
  } catch (e) { alert(e.message); }
}

async function crearCuentaEmpresa() {
  const empresa = document.getElementById('reg-empresa').value.trim();
  const rubro = document.getElementById('reg-rubro').value.trim();
  const tamano = document.getElementById('reg-tamano').value.trim();
  const nombre = document.getElementById('reg-nombre').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-pass').value;
  const errorEl = document.getElementById('reg-error');
  const btn = document.getElementById('reg-btn');

  if (!empresa || !nombre || !email || password.length < 6) {
    errorEl.textContent = 'Completa empresa, tu nombre, correo y una contraseña de al menos 6 caracteres.';
    errorEl.style.display = 'block';
    return;
  }
  errorEl.style.display = 'none';
  btn.textContent = 'Creando cuenta…'; btn.disabled = true;

  try {
    // 1. Crear el usuario en Supabase Auth
    const resSignup = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const dataSignup = await resSignup.json();
    if (!resSignup.ok) throw new Error(dataSignup.msg || dataSignup.error_description || 'No se pudo crear la cuenta.');

    // 2. Obtener sesión (si signup no la devolvió directo, la pedimos con login)
    let nuevaSesion = dataSignup.access_token ? { access_token: dataSignup.access_token, user: dataSignup.user } : null;
    if (!nuevaSesion) {
      const resLogin = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const dataLogin = await resLogin.json();
      if (!resLogin.ok) throw new Error('Cuenta creada. Intenta iniciar sesión en unos segundos.');
      nuevaSesion = { access_token: dataLogin.access_token, user: dataLogin.user };
    }
    session = nuevaSesion;

    // 3. Crear la empresa
    const resEmpresa = await fetch(`${SUPABASE_URL}/rest/v1/empresas`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${session.access_token}`, 'Content-Type': 'application/json', Prefer: 'return=representation' },
      body: JSON.stringify({ nombre: empresa, rubro: rubro || null, tamano: tamano || null, plan: 'Plan Pyme' })
    });
    const empresaCreada = await resEmpresa.json();
    if (!resEmpresa.ok) throw new Error('No se pudo crear la empresa.');

    // 4. Crear el perfil del usuario, como admin, vinculado a la empresa y al usuario de auth
    await fetch(`${SUPABASE_URL}/rest/v1/perfiles`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${session.access_token}`, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ empresa_id: empresaCreada[0].id, nombre, email, rol: 'admin', auth_user_id: session.user.id })
    });

    localStorage.setItem('zenia_session', JSON.stringify(session));
    currentView = 'panel';
    route();
  } catch (e) {
    errorEl.textContent = e.message;
    errorEl.style.display = 'block';
    btn.textContent = 'Crear cuenta'; btn.disabled = false;
  }
}

function donutChartHTML(segmentos, total) {
  const radio = 46, circun = 2 * Math.PI * radio;
  let acumulado = 0;
  const arcos = segmentos.filter(s => s.value > 0).map(s => {
    const frac = total ? s.value / total : 0;
    const largo = frac * circun;
    const offset = -acumulado * circun;
    acumulado += frac;
    return `<circle cx="60" cy="60" r="${radio}" fill="none" stroke="${s.color}" stroke-width="16" stroke-dasharray="${largo} ${circun - largo}" stroke-dashoffset="${offset}" transform="rotate(-90 60 60)"/>`;
  }).join('');
  const leyenda = segmentos.filter(s => s.value > 0).map(s => `
    <div style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px">
      <span style="width:9px;height:9px;border-radius:50%;background:${s.color};display:inline-block"></span>
      <span style="color:var(--text2)">${s.label}</span><strong style="margin-left:auto">${s.value}</strong>
    </div>`).join('') || '<div style="color:var(--text2);font-size:13px">Sin datos</div>';
  return `
  <div style="display:flex;align-items:center;gap:24px">
    <div style="position:relative;flex-shrink:0">
      <svg width="120" height="120" viewBox="0 0 120 120">${arcos}</svg>
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800">${total}</div>
    </div>
    <div style="flex:1">${leyenda}</div>
  </div>`;
}
</script>
</body>
</html>
